[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-hybrid-mpm"
version = "0.1.0"
authors = [
  { name="Institute for Disease Modeling", email="info@idmod.org" },
]
maintainers = [
  { name="Daniel J. Klein", email="daniel.klein@gatesfoundation.org" },
]
description = "Hybrid stochastic/deterministic SEIR metapopulation model with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["epidemiology", "stochastic", "GPU", "metapopulation", "SEIR", "taichi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "taichi>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest>=9.0.3",
    "pytest-cov",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/InstituteforDiseaseModeling/explore-hybrid-mpm.git"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E501",  # line-too-long
]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
]

[tool.ruff.lint.per-file-ignores]
"src/SEIR_*.py" = [
    "E741",  # ambiguous variable name 'I' (standard SEIR notation)
    "E743",  # ambiguous function name 'I' (standard SEIR notation)
]

[tool.pyright]
typeCheckingMode = "basic"
reportInvalidTypeForm = false  # Taichi uses runtime type expressions
reportAttributeAccessIssue = false  # scipy stubs incomplete (rv_discrete_frozen.pdf exists at runtime)
reportAssignmentType = "warning"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pyright>=1.1.0",
]
